# Render Blueprint: New -> Blueprint -> this repo, or the deploy link in README.md.
services:
  - type: web
    name: erp-mock
    runtime: node
    plan: free
    # Same region as staging (eu-central-1), so capture's calls stay short.
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /_health
    envVars:
      # The default 127.0.0.1 is unreachable from Render's router.
      - key: HOST
        value: 0.0.0.0
      # Gates /_calls and /_reset. Render generates it; read it in the dashboard.
      - key: ADMIN_TOKEN
        generateValue: true
      - key: NODE_VERSION
        value: "22"
